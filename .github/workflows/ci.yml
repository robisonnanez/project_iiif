name: Validación continua

on:
  pull_request:
  push:
    branches: [development, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Verificar comentarios de funciones
        run: go run ./cmd/check-comments
      - name: Verificar que OpenAPI esté actualizado
        working-directory: .
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          ./backend/scripts/generate-swagger.sh
          git diff --exit-code -- backend/docs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
