        name: format
        type: string
      - default: 85
        description: Calidad JPEG
        in: formData
        name: quality
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PDFDocument'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Subir y convertir PDF
      tags:
      - Documentos
