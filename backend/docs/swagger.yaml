      - OCR
  /api/v1/documents/{id}/ocr/autocomplete:
    get:
      description: Sugiere palabras reales del OCR por prefijo. La comparación ignora
        mayúsculas y acentos, conserva la grafía original y requiere al menos 2 caracteres.
      parameters:
      - description: ID del documento
        in: path
        name: id
        required: true
        type: string
      - description: Prefijo de palabra (mínimo 2 caracteres)
        in: query
        name: q
        required: true
        type: string
      - default: 10
        description: Máximo de sugerencias (máximo 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.OCRAutocompleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Autocompletar palabras OCR dentro de un documento
      tags:
      - OCR
  /api/v1/documents/{id}/ocr/pages/{page}:
    get:
      description: Devuelve el texto completo y, cuando existe geometría, palabras
        con bbox x0/x1/y0/y1 expresado en coordenadas del Canvas IIIF. Los OCR históricos
        sin geometría continúan con geometry_status=page_only.
      parameters:
      - description: ID del documento
        in: path
        name: id
        required: true
        type: string
      - description: Número de página
        in: path
        name: page
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.OCRPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Obtener OCR y bounding boxes de una página
      tags:
      - OCR
  /api/v1/documents/{id}/ocr/search:
    get:
      parameters:
      - description: ID del documento
        in: path
        name: id
        required: true
        type: string
      - description: Texto a buscar
        in: query
        name: q
        required: true
        type: string
      - default: 20
        description: Máximo de resultados
        in: query
        name: limit
        type: integer
      - default: 0
        description: Desplazamiento
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
