        in: formData
        name: pdf
        required: true
        type: file
      - description: Proyecto
        in: formData
        name: project
        type: string
      - description: Tenant
        in: formData
        name: tenant
        type: string
      - default: 1241
        description: Ancho maximo de imagen
        in: formData
        name: max_width
        type: integer
      - default: 1754
        description: Alto maximo de imagen
        in: formData
        name: max_height
        type: integer
      - default: 150
        description: Resolucion de render
        in: formData
        name: dpi
        type: integer
      - default: jpg
        description: Formato de salida (jpg o png)
