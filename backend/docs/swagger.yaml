basePath: /
definitions:
  config.OCRConfig:
    properties:
      artifacts:
        properties:
          gzip:
            type: boolean
        type: object
      auto_after_conversion:
        type: boolean
      candidate_languages:
        items:
          type: string
        type: array
      default_mode:
        type: string
      enabled:
        type: boolean
      fallback_languages:
        items:
          type: string
        type: array
      language_detection:
        properties:
          enabled:
            type: boolean
          max_languages:
            type: integer
          min_sample_chars:
            type: integer
          minimum_confidence:
            type: number
          sample_pages:
            type: integer
        type: object
      min_text_chars:
        type: integer
      page_timeout_seconds:
        type: integer
      render_dpi:
        type: integer
      retries_per_page:
        type: integer
      workers:
        type: integer
    type: object
  config.ProjectConfig:
    properties:
      bulk_upload:
        type: boolean
      key:
        type: string
      multitenant:
        type: boolean
      name:
        type: string
      tenants:
        items:
          type: string
        type: array
      tenants_auth_header:
        type: string
      tenants_auth_token:
        type: string
      tenants_auth_type:
        type: string
      tenants_endpoint:
        type: string
      tenants_token_configured:
        type: boolean
    type: object
  handlers.editableConfigPayload:
    properties:
      binary_storage:
        properties:
          mode:
            type: string
          temp_path:
            type: string
        type: object
      conversion:
        properties:
          default_format:
            type: string
          default_height:
            type: integer
          default_quality:
            type: integer
          default_width:
            type: integer
          dpi:
            type: integer
          enable_ocr:
            type: boolean
        type: object
      database:
        properties:
          DB_CONNECTION:
            type: string
          DB_DATABASE:
            type: string
          DB_HOST:
            type: string
          DB_PASSWORD:
            type: string
          DB_PORT:
            type: string
          DB_USERNAME:
            type: string
          auto_migrate:
            type: boolean
          mongodb:
            properties:
              auth_source:
                type: string
              database:
                type: string
              direct_connection:
                type: boolean
              host:
                type: string
              password:
                type: string
              port:
                type: string
              server_selection_timeout_ms:
                type: integer
              user:
                type: string
            type: object
          mysql:
            properties:
              charset:
                type: string
              database:
                type: string
              host:
                type: string
              parse_time:
                type: boolean
              password:
                type: string
              port:
                type: string
              user:
                type: string
            type: object
          postgres:
            properties:
              database:
                type: string
              host:
                type: string
              password:
                type: string
              port:
                type: string
              schema:
                type: string
              sslmode:
                type: string
              user:
                type: string
            type: object
        type: object
      frontend:
        properties:
          enabled:
            type: boolean
          menu_orientation:
            type: string
          password:
            type: string
          path:
            type: string
          require_auth:
            type: boolean
          username:
            type: string
        type: object
      iiif:
        properties:
          api_version:
            type: string
          base_url:
            type: string
          cache:
            type: boolean
          cache_ttl:
            type: integer
          max_height:
            type: integer
          max_width:
            type: integer
        type: object
      ocr:
        $ref: '#/definitions/config.OCRConfig'
      projects:
        properties:
          allow_dynamic_tenants:
            type: boolean
          default_project:
            type: string
          enabled:
            type: boolean
          items:
            items:
              $ref: '#/definitions/config.ProjectConfig'
            type: array
          require_project:
            type: boolean
        type: object
      s3:
        properties:
          access_key_id:
            type: string
          bucket:
            type: string
          endpoint:
            type: string
          filesystem_disk:
            type: string
          region:
            type: string
          secret_access_key:
            type: string
          use_path_style_endpoint:
            type: boolean
        type: object
      security:
        properties:
          cors_origins:
            items:
              type: string
            type: array
          enable_auth:
            type: boolean
          log_level:
            type: string
          max_concurrent_uploads:
            type: integer
        type: object
      server:
        properties:
          mode:
            type: string
          port:
            type: string
        type: object
      storage:
        properties:
          backend:
            type: string
          data_path:
            type: string
          documents_path:
            type: string
          images_path:
            type: string
          manifests_path:
            type: string
          pdfs_path:
            type: string
          thumbnails_path:
            type: string
        type: object
    type: object
  handlers.errorResponse:
    properties:
      details:
        example: detalle interno
        type: string
      error:
        example: login requerido
        type: string
    type: object
  handlers.loginRequest:
    properties:
      password:
        example: CAMBIAR_PASSWORD
        type: string
      username:
        example: admin
        type: string
    type: object
  handlers.migrationStartPayload:
    properties:
      scope:
        $ref: '#/definitions/handlers.migrationStartScope'
      source:
        $ref: '#/definitions/handlers.migrationStartSource'
    type: object
  handlers.migrationStartScope:
    properties:
      project_key:
        example: metavisor
        type: string
      tenant_key:
        example: sunat
        type: string
    type: object
  handlers.migrationStartSource:
    properties:
      local:
        $ref: '#/definitions/handlers.migrationStartSourceLocal'
      ssh:
        $ref: '#/definitions/handlers.migrationStartSourceSSH'
      type:
        example: local
        type: string
    type: object
  handlers.migrationStartSourceLocal:
    properties:
      path:
        example: /var/lib/project_iiif
        type: string
    type: object
  handlers.migrationStartSourceSSH:
    properties:
      host:
        example: 172.21.227.83
        type: string
      path:
        example: /var/lib/project_iiif
        type: string
      port:
        example: 2230
        type: integer
      private_key:
        example: '-----BEGIN OPENSSH PRIVATE KEY-----'
        type: string
      user:
        example: robison
        type: string
    type: object
  handlers.okMessageResponse:
    properties:
      message:
        example: ok
        type: string
    type: object
  handlers.restartServiceRequest:
    properties:
      password:
        example: tu_password_sudo
        type: string
    type: object
  handlers.restartServiceResponse:
    properties:
      active:
        example: true
        type: boolean
      message:
        example: reinicio programado; el servicio se reiniciara en breve
        type: string
      ok:
        example: true
        type: boolean
    type: object
  handlers.sessionResponse:
    properties:
      authenticated:
        example: true
        type: boolean
      username:
        example: admin
        type: string
    type: object
  models.IIIFAnnotation:
    properties:
      body:
        $ref: '#/definitions/models.IIIFBody'
      id:
        type: string
      motivation:
        type: string
      target:
        type: string
      type:
        type: string
    type: object
  models.IIIFAnnotationPage:
    properties:
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/models.IIIFAnnotation'
        type: array
      type:
        type: string
    type: object
  models.IIIFBody:
    properties:
      format:
        type: string
      id:
        type: string
      service:
        items:
          $ref: '#/definitions/models.IIIFService'
        type: array
      type:
        type: string
    type: object
  models.IIIFCanvas:
    properties:
      height:
        type: integer
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/models.IIIFAnnotationPage'
        type: array
      label: {}
      type:
        type: string
      width:
        type: integer
    type: object
  models.IIIFImageInfo:
    properties:
      '@context':
        type: string
      height:
        type: integer
      id:
        type: string
      profile:
        type: string
      protocol:
        type: string
      sizes:
        items:
          $ref: '#/definitions/models.IIIFSize'
        type: array
      tiles:
        items:
          $ref: '#/definitions/models.IIIFTile'
        type: array
      type:
        type: string
      width:
        type: integer
    type: object
  models.IIIFManifest:
    properties:
      '@context':
        items:
          type: string
        type: array
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/models.IIIFCanvas'
        type: array
      label: {}
      type:
        type: string
    type: object
  models.IIIFService:
    properties:
      '@context':
        type: string
      id:
        type: string
      profile:
        type: string
      type:
        type: string
    type: object
  models.IIIFSize:
    properties:
      height:
        type: integer
      width:
        type: integer
    type: object
  models.IIIFTile:
    properties:
      height:
        type: integer
      scaleFactors:
        items:
          type: integer
        type: array
      width:
        type: integer
    type: object
  models.PDFDocument:
    properties:
      conversionDpi:
        type: integer
      conversionFormat:
        type: string
      conversionHeight:
        type: integer
      conversionQuality:
        type: integer
      conversionWidth:
        type: integer
      convertedPages:
        type: integer
      id:
        type: string
      manifestUrl:
        type: string
      migratedFromLocal:
        type: boolean
      name:
        type: string
      outline:
        items:
          $ref: '#/definitions/models.PDFOutlineItem'
        type: array
      projectKey:
        type: string
      status:
        description: processing, completed, error
        type: string
      tenantKey:
        type: string
      thumbnailUrl:
        type: string
      totalPages:
        type: integer
      uploadDate:
        type: string
    type: object
  models.PDFOutlineItem:
    properties:
      level:
        type: integer
      pageNumber:
        type: integer
      title:
        type: string
    type: object
  services.CreateOCRJobRequest:
    properties:
      force:
        type: boolean
      language_mode:
        type: string
      languages:
        items:
          type: string
        type: array
      mode:
        type: string
    type: object
  services.OCRAutocompleteItem:
    properties:
      frequency:
        type: integer
      text:
        type: string
    type: object
  services.OCRAutocompleteResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/services.OCRAutocompleteItem'
        type: array
      query:
        type: string
    type: object
  services.OCRBoundingBox:
    properties:
      x0:
        example: 940
        type: integer
      x1:
        example: 1016
        type: integer
      y0:
        example: 1543
        type: integer
      y1:
        example: 1557
        type: integer
    type: object
  services.OCRDocumentSummary:
    properties:
      active_generation:
        type: string
      document_id:
        type: string
      failed_pages:
        type: integer
      indexed_pages:
        type: integer
      languages:
        items:
          type: string
        type: array
      project_key:
        type: string
      status:
        type: string
      tenant_key:
        type: string
      total_pages:
        type: integer
      updated_at:
        type: string
    type: object
  services.OCRJob:
    properties:
      cancel_requested:
        type: boolean
      created_at:
        type: string
      current_page:
        type: integer
      document_id:
        type: string
      error:
        type: string
      failed_pages:
        type: integer
      finished_at:
        type: string
      generation:
        type: string
      id:
        type: string
      language_mode:
        type: string
      languages:
        items:
          type: string
        type: array
      mode:
        type: string
      processed_pages:
        type: integer
      project_key:
        type: string
      started_at:
        type: string
      status:
        type: string
      tenant_key:
        type: string
      total_pages:
        type: integer
    type: object
  services.OCRPage:
    properties:
      canvas_v2:
        type: string
      canvas_v3:
        type: string
      confidence:
        type: number
      created_at:
        type: string
      document_id:
        type: string
      engine:
        type: string
      error:
        type: string
      generation:
        type: string
      geometry_error:
        type: string
      geometry_space:
        type: string
      geometry_status:
        type: string
      height:
        type: integer
      iiif_image:
        type: string
      image_id:
        type: string
      language:
        type: string
      native_text:
        type: string
      ocr_image_height:
        type: integer
      ocr_image_width:
        type: integer
      ocr_text:
        type: string
      page_number:
        type: integer
      schema_version:
        type: integer
      source:
        type: string
      status:
        type: string
      text:
        type: string
      width:
        type: integer
      words:
        items:
          $ref: '#/definitions/services.OCRWord'
        type: array
    type: object
  services.OCRWord:
    properties:
      bbox:
        $ref: '#/definitions/services.OCRBoundingBox'
      confidence:
        example: 95.20067596435548
        type: number
      text:
        example: SÁNCHEZ,
        type: string
    type: object
info:
  contact: {}
  description: 'API publica unificada: gestion documental v1 e interoperabilidad IIIF
    Image/Presentation API 3. Las rutas heredadas permanecen operativas pero no se
    anuncian en esta documentacion.'
  title: IIIF PDF Server API
  version: "1.0"
paths:
  /api/v1/admin/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Obtener configuracion saneada
      tags:
      - Admin
    put:
      consumes:
      - application/json
      parameters:
      - description: Configuracion editable
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.editableConfigPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Guardar configuracion editable
      tags:
      - Admin
  /api/v1/admin/db/migrations/run:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Ejecutar migraciones pendientes del motor activo
      tags:
      - Admin
  /api/v1/admin/db/migrations/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Estado de migraciones de base de datos
      tags:
      - Admin
  /api/v1/admin/documents/{id}/images:
    get:
      parameters:
      - description: ID documento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Listar imagenes IIIF por documento
      tags:
      - Admin
  /api/v1/admin/documents/{id}/ocr/jobs:
    post:
      consumes:
      - application/json
      description: Inicia una generación OCR híbrida, exhaustiva o solo OCR. Requiere
        sesión administrativa.
      parameters:
      - description: ID del documento
        in: path
        name: id
        required: true
        type: string
      - description: Configuración del trabajo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.CreateOCRJobRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/services.OCRJob'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Crear trabajo OCR
      tags:
      - OCR
  /api/v1/admin/migrations/local-to-db/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: Origen y scope
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.migrationStartPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Iniciar migracion local/ssh a base de datos activa (MySQL/Postgres/MongoDB)
      tags:
      - Admin
  /api/v1/admin/migrations/local-to-db/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Estado de migracion local/ssh a base de datos activa (MySQL/Postgres/MongoDB)
      tags:
      - Admin
  /api/v1/admin/migrations/sources/local/browse:
    get:
      parameters:
      - description: Ruta base a explorar
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Explorar directorios locales permitidos para migracion
      tags:
      - Admin
  /api/v1/admin/ocr/jobs/{job_id}:
    get:
      parameters:
      - description: ID del trabajo
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.OCRJob'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Consultar progreso OCR
      tags:
      - OCR
  /api/v1/admin/ocr/jobs/{job_id}/cancel:
    post:
      parameters:
      - description: ID del trabajo
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.OCRJob'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Cancelar trabajo OCR
      tags:
      - OCR
  /api/v1/admin/projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Listar proyectos y tenants
      tags:
      - Admin
  /api/v1/admin/projects/{key}/sync-tenants:
    post:
      description: Consulta el endpoint configurado para el proyecto, normaliza la
        lista y la persiste en config.yaml.
      parameters:
      - description: Clave del proyecto
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/config.ProjectConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Sincronizar tenants de un proyecto
      tags:
      - Admin
  /api/v1/admin/service/restart:
    post:
      consumes:
      - application/json
      description: Valida password sudo y programa reinicio asincrono de project-iiif.
      parameters:
      - description: Password sudo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.restartServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.restartServiceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - SessionCookie: []
      summary: Programar reinicio del servicio
      tags:
      - Admin
  /api/v1/documents:
    get:
      description: Lista documentos con filtros opcionales por proyecto y tenant.
      parameters:
      - description: Proyecto
        in: query
        name: project
        type: string
      - description: Tenant
        in: query
